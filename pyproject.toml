[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildtrace"
version = "0.1.0"
description = "ETL-first pipeline for WildTrace visual datasets"
readme = "docs/Plan.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0.0",
  "Pillow>=10.4.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
include = ["wildtrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
