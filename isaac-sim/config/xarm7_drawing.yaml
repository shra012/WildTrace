project:
  trajectory_path: data/puppy_two_stroke.json
  output_dir: outputs

robot:
  urdf_path: assets/xarm7/xarm7_with_pen.urdf
  # Committed artifact, imported while the vendored xarm_description meshes were
  # still on disk. The URDF's mesh paths are now dangling, so re-importing it
  # silently produces link prims with no visual or collision geometry; pass
  # --reimport to check_environment.py only after re-vendoring those meshes.
  usd_path: assets/xarm7/xarm7.usd
  robot_description_path: assets/xarm7/robot_description.yaml
  prim_path: /World/xarm7
  end_effector_frame: pen_tip
  flange_frame: link_eef
  expected_joint_names: [joint1, joint2, joint3, joint4, joint5, joint6, joint7]
  home_joint_positions_rad: [0.0, -0.35, 0.0, 1.20, 0.0, 1.55, 0.0]
  home_joint_tolerance_rad: 0.02
  # Isaac/PhysX position-drive gains. Acceleration drives make gains independent
  # of link mass while URDF effort limits remain available on the joints.
  drive_type: acceleration
  drive_stiffness: 400.0
  # Raised from 40 → 55 → 70: the tolerance-gated controller re-commands a new IK
  # solution every step, so the residual the drive carries into a direction
  # change is what shows up as corner overshoot. More damping settles that
  # residual without the instability that raising stiffness would invite.
  # Raised again (70 → 85) to settle residual tip motion before corners;
  # knots are mostly underdamped overshoot when the waypoint advances.
  drive_damping: 95.0
  # Per-step joint-target slew cap. Slightly below the URDF 3.14/60 limit so
  # corner IK steps cannot slam the drive into an overshoot loop.
  max_joint_delta_rad: 0.035

drawing:
  surface_center_xy_m: [0.45, 0.0]
  surface_size_xy_m: [0.16, 0.12]
  paper_top_z_m: 0.20
  pen_down_z_m: 0.201
  pen_up_z_m: 0.235
  approach_height_m: 0.27
  flip_image_y: true
  # Raised from 0.08: contour-extraction noise leaves small zigzags that a
  # tolerance-gated per-waypoint IK controller cannot track smoothly, showing
  # up as small overshoot loops ("knots") at corners. corner_angle_degrees
  # still protects genuine sharp corners (tail tips, ears) from being smoothed
  # away.
  # Stronger Laplacian pass to remove contour zigzags that show up as wavy
  # executed strokes; genuine sharp corners stay protected by corner_angle.
  smoothing_strength: 0.40
  corner_angle_degrees: 28.0
  # Halved from 0.005: smaller steps mean smaller direction-change-per-step at
  # high-curvature points, which is what actually drives the overshoot/knot
  # behavior (each step is closer to the previous IK solution, so there is
  # less transient error to settle before the tolerance check passes).
  max_cartesian_step_m: 0.0015
  # Straights can be slightly looser than corners so the tip does not jitter
  # between noisy waypoints; corners stay much tighter.
  # Loosened from 0.00075: the tighter value drove real-robot draw time to
  # ~12.4 min (simulation_duration_s) on a 6-stroke sample, well over the
  # <10 min budget. This keeps ~4x tighter than the pre-fix flat 3mm gate.
  target_tolerance_m: 0.0012
  # Sharp direction changes settle tighter before advancing so the drive has
  # less residual error to carry into the turn. Loosened from 0.00035 for the
  # same time-budget reason; still ~5x tighter than the pre-fix flat gate.
  corner_tolerance_m: 0.0006
  # Loosened from 3.5: still gates residual momentum at corners, just not to
  # a near-full stop, trading a little accuracy back for real-robot time.
  max_tip_speed_mm_s: 7.0
  # Waypoints within this many indices of a detected corner also use
  # corner_tolerance_m, because overshoot appears just after a vertex.
  # Narrowed from 8 so fewer waypoints pay the stricter corner settle cost.
  corner_window_points: 5
  # Subdivide only the segments touching a corner, adding gated stops through
  # a turn without slowing the straight sections. Reduced from 5: fewer
  # subdivided stops per corner is the single biggest lever on total time.
  corner_densify_factor: 3
  # Adaptive IK tolerance - tighter convergence at corners. Loosened from
  # 0.00008 alongside the other corner gates.
  corner_ik_tolerance_m: 0.00015
  # 180 degrees about world X: pen local +Z points toward the paper (world -Z).
  orientation_wxyz: [0.0, 1.0, 0.0, 0.0]
  orientation_tolerance_rad: 0.04
  # Lula IK convergence tolerance, deliberately far tighter than the reach
  # gate. The IK solver previously used target_tolerance_m as well, so the
  # commanded solution could itself sit a full gate-width off the waypoint and
  # the measured tip could never reliably do better than the gate.
  # Normal waypoints use 0.2mm, corners use corner_ik_tolerance_m (0.12mm).
  ik_position_tolerance_m: 0.0002
  # Spatial scale at which pen-path heading is judged. It is applied to both
  # the desired tangent chord and the measured tip travel direction so the
  # two are compared like for like.
  #
  # The mapped contour is sampled at roughly 1.2 mm, well below the scale of
  # the extracted outline, so adjacent desired segments can reverse direction
  # outright: measured at that scale the desired heading swings up to 178 deg
  # between neighbouring waypoints and the resulting "heading error" reports
  # extraction noise, not tracking quality. 4 mm spans several waypoints and
  # is still only 2.5 percent of the 160 mm drawing width.
  heading_chord_m: 0.004
  # Tip samples retained to find that chord. At the observed ~0.08 mm of tip
  # travel per physics step, 4 mm needs about 50 samples; 256 leaves headroom
  # for the slower settling phases.
  heading_history_samples: 256
  # How far back along the commanded waypoints the desired tangent may be
  # read. The tip trails the waypoint it is chasing by a millimetre or two,
  # so the tangent is taken at the nearest already-passed waypoint; bounding
  # the search stops a closed outline matching the far side of the loop.
  heading_lookback_targets: 40

safety:
  # Stage-1 kinematic baseline: isolate IK/state-machine tracking without
  # exceeding the official URDF effort caps. Tune gravity compensation later.
  gravity_m_s2: 0.0
  workspace_min_m: [0.25, -0.25, 0.18]
  workspace_max_m: [0.70, 0.25, 0.75]
  # Raised from 4.0/180.0: the tighter reach gate, corner densification and
  # joint slew cap all trade simulated time for accuracy, so the old budgets
  # would abort an otherwise healthy run. These remain hard safety stops.
  # Raised again for stricter velocity/corner gates (more settle time).
  waypoint_timeout_s: 14.0
  home_timeout_s: 12.0
  run_timeout_s: 1500.0
  physics_dt_s: 0.0166666667
  # Consecutive IK non-convergences tolerated before a safe stop. With the
  # much tighter ik_position_tolerance_m a single transient miss is not a
  # safety event; a persistent one still is.
  max_ik_failures: 3

recording:
  lookahead_points: 5
  demo_path: outputs/demonstration_two_stroke.npz

training:
  hidden_layers: [256, 256, 128]
  seed: 17
  validation_fraction: 0.2
  batch_size: 128
  learning_rate: 0.001
  max_epochs: 200
  patience: 20
  max_action_delta_m: 0.005
  checkpoint_path: outputs/bc_best.pt
  tensorboard_dir: outputs/tensorboard
