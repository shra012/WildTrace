allowed_buckets:
  - left_profile
  - right_profile
  - front_left_3q
  - front_right_3q
  - front
rejected_buckets:
  - rear
  - top_down
  - occluded
  - unknown
prefilter:
  require_mask: true
  min_mask_coverage_ratio: 0.03
  max_border_touch_ratio: 0.50
  max_component_count: 4
  min_largest_component_ratio: 0.75
  min_bbox_fill_ratio: 0.10
  max_top_mass_dominance: 0.18
classifier:
  backend: local_score_v1
  direction_deadzone: 0.05
  front_symmetry_bias: 0.72
  three_quarter_symmetry_target: 0.58
  three_quarter_symmetry_tolerance: 0.25
min_confidence: 0.42
min_margin: 0.08
target_per_bucket:
  default: 0

