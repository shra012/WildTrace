enrichment:
  backend: bioclip_huggingface
  model_backend: huggingface
  model_name: ${HF_ENRICHMENT_MODEL:-imageomics/bioclip}
  model_id: ${HF_ENRICHMENT_MODEL:-imageomics/bioclip}
  cache_dir: ${HF_HOME:-~/.cache/huggingface}
  device: ${BIOCLIP_DEVICE:-cuda}
  top_k_tags: 3
  default_confidence: 0.72
outline_generator:
  backend: informative_drawings
  model_backend: onnxruntime
  model_name: informative_drawings
  model_version_or_checkpoint: ${INFORMATIVE_DRAWINGS_REPO:-rocca/informative-drawings-line-art-onnx}/${INFORMATIVE_DRAWINGS_FILENAME:-model.onnx}
  repo_id: ${INFORMATIVE_DRAWINGS_REPO:-rocca/informative-drawings-line-art-onnx}
  filename: ${INFORMATIVE_DRAWINGS_FILENAME:-model.onnx}
  cache_dir: ${HF_HOME:-~/.cache/huggingface}
  input_size: 512
  render_mode: informative_drawings
  line_threshold: 26
  postprocess_blur_radius: 2.0
  min_component_area: 80
  outline_simplify_ratio: 0.003
  outline_smooth_sigma: 1.5
  outline_stroke_width: 4
  max_attempts: 5
  default_params:
    render_mode: informative_drawings
    blur_radius: 2.0
    threshold: 26
outline_rectifier:
  backend: controlnet_lineart_rectifier
  model_backend: diffusers
  model_name: ${OUTLINE_RECTIFIER_BASE_MODEL:-runwayml/stable-diffusion-v1-5}
  controlnet_model_name: ${OUTLINE_RECTIFIER_CONTROLNET_MODEL:-lllyasviel/control_v11p_sd15_lineart}
  model_version_or_checkpoint: ${OUTLINE_RECTIFIER_BASE_MODEL:-runwayml/stable-diffusion-v1-5}
  cache_dir: ${HF_HOME:-~/.cache/huggingface}
  device: ${OUTLINE_RECTIFIER_DEVICE:-cuda}
  torch_dtype: ${OUTLINE_RECTIFIER_TORCH_DTYPE:-float16}
  guidance_scale: 7.5
  num_inference_steps: 30
  controlnet_conditioning_scale: 1.0
  prompt: a clean human-drawn style outline of {context}, full subject visible, minimal internal detail, white background, black ink lines
  negative_prompt: detailed texture, shading, hatching, feathers, fur, scales, interior detail, clutter, background objects, color fills
  conditioning_source: subject_canny
  canny_low_threshold: 80
  canny_high_threshold: 180
  fallback_backend: silhouette_outline_rectifier
  subject_threshold: 248
  silhouette_close_kernel: 9
  outline_close_kernel: 5
  outline_simplify_ratio: 0.003
  outline_smooth_sigma: 1.5
  outline_stroke_width: 4
  min_outline_area: 300
  max_outlines: 2
  min_component_area: 80
  rectifier_threshold: 235
  rectifier_close_kernel: 5
outline_validator:
  backend: ${SEMANTIC_VALIDATOR_BACKEND:-auto}
  model_backend: auto
  ollama_model_name: ${OLLAMA_VALIDATOR_MODEL:-qwen2.5vl:7b}
  ollama_model_id: ${OLLAMA_VALIDATOR_MODEL:-qwen2.5vl:7b}
  anthropic_model_name: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
  anthropic_api_base: ${ANTHROPIC_API_BASE:-https://api.anthropic.com}
  anthropic_timeout_seconds: 30
  anthropic_max_tokens: 200
  anthropic_temperature: 0.0
  min_score: 0.55
opencv_prescreen:
  min_foreground_ratio: 0.03
  max_foreground_ratio: 0.32
  target_foreground_ratio: 0.16
  max_component_count: 18
  max_small_contour_ratio: 0.70
