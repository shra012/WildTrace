enrichment:
  backend: bioclip_huggingface
  model_backend: huggingface
  model_name: ${HF_ENRICHMENT_MODEL:-imageomics/bioclip}
  model_id: ${HF_ENRICHMENT_MODEL:-imageomics/bioclip}
  cache_dir: ${HF_HOME:-~/.cache/huggingface}
  device: ${BIOCLIP_DEVICE:-cuda}
  top_k_tags: 3
  default_confidence: 0.72
outline_rectifier:
  backend: flux_silhouette_rectifier
  strength: 0.90
  min_component_area: 80
  subject_threshold: 248
  silhouette_close_kernel: 9
  gguf_repo: city96/FLUX.1-schnell-gguf
  gguf_file: flux1-schnell-Q4_K_S.gguf
  base_model: black-forest-labs/FLUX.1-schnell
outline_validator:
  backend: ${SEMANTIC_VALIDATOR_BACKEND:-auto}
  model_backend: auto
  ollama_model_name: ${OLLAMA_VALIDATOR_MODEL:-qwen2.5vl:7b}
  ollama_model_id: ${OLLAMA_VALIDATOR_MODEL:-qwen2.5vl:7b}
  anthropic_model_name: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
  anthropic_api_base: ${ANTHROPIC_API_BASE:-https://api.anthropic.com}
  anthropic_timeout_seconds: 30
  anthropic_max_tokens: 200
  anthropic_temperature: 0.0
  min_score: 0.55
opencv_prescreen:
  min_foreground_ratio: 0.03
  max_foreground_ratio: 0.32
  target_foreground_ratio: 0.16
  max_component_count: 18
  max_small_contour_ratio: 0.70
