    { name = "numpy" },
    { name = "pillow" },
    { name = "pyyaml" },
]

[package.optional-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "numpy", specifier = ">=2.0.0" },
    { name = "pillow", specifier = ">=10.4.0" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.3.0" },
    { name = "pyyaml", specifier = ">=6.0.2" },
]
provides-extras = ["dev"]
